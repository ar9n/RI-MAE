optimizer : {
  type: AdamW,
  kwargs: {
  lr : 0.0005, 
  weight_decay : 0.05
}}

scheduler: {
  type: CosLR,
  kwargs: {
    epochs: 300,
    initial_epochs : 10
}}

dataset : {
  train : { _base_: cfgs/dataset_configs/EngineeringShapeBenchmark.yaml, 
            others: {subset: 'train', npoints: 1024, whole: True}},
  val : { _base_: cfgs/dataset_configs/EngineeringShapeBenchmark.yaml, 
            others: {subset: 'test', npoints: 1024, whole: True}},
  test : { _base_: cfgs/dataset_configs/EngineeringShapeBenchmark.yaml, 
            others: {subset: 'test', npoints: 1024, whole: True}}}

model : {
  NAME: RITransformer_MAE,
  trans_dim: 384, 
  depth: 12, 
  drop_path_rate: 0.1, 
  cls_dim: 45, 
  num_heads: 6,
  group_size: 32, 
  num_group: 64, 
  encoder_dims: 256,
  use_dropout: False,
}
npoints: 1024
total_bs : 32
step_per_update : 1
max_epoch : 300
grad_norm_clip : 10
#1512

consider_metric: CDL1
evaluate_retrieval_acc: True
